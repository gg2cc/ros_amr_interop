mqtt_bridge:
  ros__parameters:
    mqtt_address: "192.168.124.1"
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
    manufacturer_name: "robots"
    serial_number: "robot_1"

controller:
  ros__parameters:
    robot_name: "robot_1"
    manufacturer_name: "robots"
    serial_number: "robot_1"
    # 启用多节点导航 action，使运行中的订单可通过 STITCH 续接。
    enable_nav_through_nodes: true

adapter:
  ros__parameters:
    robot_name: "robot_1"
    manufacturer_name: "robots"
    serial_number: "robot_1"
